services:
  - type: web
    name: inffyn-engine
    runtime: python
    rootDir: engine
    buildCommand: pip install -r requirements.txt -c constraints-v1.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # SUPABASE_JWT_SECRET optional — omit when using asymmetric JWKS (ES256)
