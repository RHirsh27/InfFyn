name: Verify InfFyn
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: offline-test-placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/constraints-v1.txt
      - name: Check source publication boundaries
        run: python scripts/check-source-safety.py
      - name: Install web dependencies
        run: npm ci
      - name: Install engine dependencies
        run: python -m pip install -r engine/requirements.txt -c engine/constraints-v1.txt
      - name: Test engine
        run: python -m pytest engine/tests -q
      - name: Verify PostgreSQL import controls
        run: node tests/reviewed-import-migration.test.mjs
      - name: Verify app, alpha boundaries and recovery tooling
        run: node --test tests/alpha-app.test.mjs tests/private-alpha-acceptance.test.mjs tests/private-alpha-backup.test.mjs tests/private-alpha-database.test.mjs tests/private-alpha-setup.test.mjs
      - name: Build web application
        run: npm run build:app
      - name: Check TypeScript
        run: npm run typecheck --workspace=app
      - name: Report hosted acceptance separately
        run: node scripts/acceptance/run-reviewed-import.mjs
